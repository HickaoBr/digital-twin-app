# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/digital_twin_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=digital_twin_user
spring.datasource.password=digital_twin_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configurações adicionais
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT Configuration
# Chave secreta (em produção, use variável de ambiente)
jwt.secret=digital-twin-secret-key-must-be-at-least-256-bits-long-for-hs256
# Tempo de expiração em milissegundos (24 horas)
jwt.expiration=86400000

# Server Configuration
server.port=8080