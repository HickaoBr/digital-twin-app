version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: digital-twin-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: digital_twin_db
      MYSQL_USER: digital_twin_user
      MYSQL_PASSWORD: digital_twin_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - digital-twin-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  mysql_data:
    driver: local

networks:
  digital-twin-network:
    driver: bridge
